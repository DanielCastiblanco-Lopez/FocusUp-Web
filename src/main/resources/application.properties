# =====================================================
# FocusUp - Módulos integrados (tareas + usuarios con roles)
# Configuración de Spring Boot
# =====================================================

# ── Servidor ──────────────────────────────────────────
server.port=8080
server.servlet.context-path=/focusup

# ── Sesión (login) ────────────────────────────────────
# La sesión expira tras 30 minutos sin actividad.
server.servlet.session.timeout=30m
# La cookie no la puede leer JavaScript (protege contra robo por XSS).
server.servlet.session.cookie.http-only=true
# El navegador no envía la cookie en peticiones iniciadas desde otros sitios (ayuda contra CSRF).
server.servlet.session.cookie.same-site=lax
# El id de sesión viaja solo en la cookie, nunca en la URL.
server.servlet.session.tracking-modes=cookie

# ── Base de datos MySQL ───────────────────────────────
# Una sola base para tareas y usuarios (antes el módulo web usaba focusup_web).
spring.datasource.url=jdbc:mysql://localhost:3306/focusup_db?useSSL=false&serverTimezone=America/Bogota&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=FocusUp!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────
# update: crea/actualiza tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Administrador inicial ─────────────────────────────
# Se crea al arrancar solo si todavía no existe ningún administrador.
# IMPORTANTE: cambia esta contraseña desde "Mi cuenta" en el primer ingreso.
focusup.admin.email=admin@focusup.com
focusup.admin.password=Admin123*

# ── Thymeleaf ─────────────────────────────────────────
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ── Mensajes de log ───────────────────────────────────
logging.level.com.focusup=INFO
logging.level.org.springframework.web=INFO
